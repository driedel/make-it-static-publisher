# Deploy to WordPress.org on release.
#
# Release discipline (SemVer): the git tag, the `Version:` header in
# the plugin's main PHP file, and the `Stable tag:` in readme.txt must all match
# (e.g. 1.0.0). The deploy action extracts the version from the header and
# tags that SVN version, so a mismatch breaks the release.
name: Deploy to WordPress.org

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version alignment
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          test -n "$VERSION"
          grep -E "Version:[[:space:]]+$VERSION([^0-9.]|$)" make-it-static.php
          grep -F "define( 'MIS_VERSION', '$VERSION' );" make-it-static.php
          grep -E "Stable tag:[[:space:]]+$VERSION([^0-9.]|$)" readme.txt
          grep -F "= $VERSION =" readme.txt
          grep -F "[$VERSION]" CHANGELOG.md

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install WordPress Coding Standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction \
            squizlabs/php_codesniffer \
            dealerdirect/phpcodesniffer-composer-installer \
            wp-coding-standards/wpcs

      - name: Run PHPCS
        run: |
          export PATH="$HOME/.composer/vendor/bin:$HOME/.config/composer/vendor/bin:$PATH"
          phpcs --standard=WordPress-Core --extensions=php \
            --ignore=.wordpress-org,.git,node_modules,vendor \
            .
          phpcs --standard=WordPress-Extra --extensions=php \
            --ignore=.wordpress-org,.git,node_modules,vendor \
            --runtime-set ignore_warnings_on_exit 1 \
            .

  deploy:
    name: Push to SVN and attach ZIP
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@v1
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: make-it-static-publisher
          VERSION: ${{ github.event.release.tag_name }}

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/make-it-static-publisher.zip

  assets:
    name: Sync readme.txt and assets
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update readme.txt and .wordpress-org assets
        uses: 10up/action-wordpress-plugin-asset-update@v1
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: make-it-static-publisher
          VERSION: ${{ github.event.release.tag_name }}
